services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dialer
    ports:
      - "5432:5432"
    volumes:
      - dialer_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dialer"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dialer_pgdata:
